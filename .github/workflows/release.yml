name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The signing key lives only in repository secrets. Without it the build would
      # produce an unsigned APK, which the verification step below refuses to publish.
      # The secrets context is not available in a step-level `if`, so the presence
      # check happens inside the script instead.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LEX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::LEX_KEYSTORE_BASE64 is not set. A release must be signed with a real key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LEX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Assemble release APK
        env:
          LEX_KEYSTORE_PASSWORD: ${{ secrets.LEX_KEYSTORE_PASSWORD }}
          LEX_KEY_ALIAS: ${{ secrets.LEX_KEY_ALIAS }}
          LEX_KEY_PASSWORD: ${{ secrets.LEX_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease

      - name: Stage artifact
        id: stage
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          name="lex-${GITHUB_REF_NAME:-dev}.apk"
          cp "$apk" "$name"
          echo "apk=$name" >> "$GITHUB_OUTPUT"

      # A release must be signed with the one key whose fingerprint is pinned here, so
      # neither the public debug key nor an unsigned build can reach a download page:
      # Android identifies an app by its signing certificate and would accept either as
      # an update to an installed Lex. Certificate fingerprints are public information --
      # they ship inside every APK -- so pinning one here reveals nothing.
      - name: Verify the APK is signed with the release key
        env:
          EXPECTED_SHA256: b70b89f0eb45b6862a94ddf1ee9e16f5dd7627ac48036afe2028143168cbb17c
        run: |
          set -o pipefail
          apk="${{ steps.stage.outputs.apk }}"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt
          # apksigner has printed both "Signer #1 certificate SHA-256 digest:" and
          # "V2 Signer: certificate SHA-256 digest:" across versions, so match the tail.
          if ! grep -qiE "certificate SHA-256 digest: *$EXPECTED_SHA256" /tmp/certs.txt; then
            echo "::error::APK is not signed with the expected release certificate."
            echo "::error::Expected SHA-256 $EXPECTED_SHA256"
            exit 1
          fi
          echo "Signed with the expected release certificate."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stage.outputs.apk }}
          generate_release_notes: true
          draft: false
